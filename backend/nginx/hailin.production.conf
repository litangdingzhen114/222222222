server {
  listen 80;
  server_name api.hailin.store;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name api.hailin.store;

  ssl_certificate /etc/letsencrypt/live/api.hailin.store/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.hailin.store/privkey.pem;

  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://api:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
  }

  location /health {
    proxy_pass http://api:8787/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /media/ {
    proxy_pass http://api:8787/media/;
    proxy_http_version 1.1;
  }

  location /uploads/ {
    proxy_pass http://api:8787/uploads/;
    proxy_http_version 1.1;
  }

  location /admin/ {
    proxy_pass http://api:8787/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
